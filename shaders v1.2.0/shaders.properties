# ==============================================================================
# AuraLite Shader Pack - Menu & Settings Configuration (v1.2.0)
# ==============================================================================
# [v1.2.0] First release of the physical-cloud line. Everything that was
# experimental in 1.1.4 is now the default path, and every development
# instrument from the development cycle has been removed from the shipped
# code (no debug switches, no on-screen gauges, no diagnostic stripes).
#
# [v1.2.0] VOLUMETRIC CLOUD ENGINE - CLOUD_MODE=1 is now the only path a
#   profile selects. The cloud deck is a microphysically parameterised medium
#   (liquid water content, droplet radius, extinction from the droplet spectrum)
#   with its own multiple-scattering approximation, an optional cirrus veil and
#   an optional mid-level deck. Resolution (CLOUD_QUALITY: raymarch steps) and
#   detail (CLOUD_DETAIL: shape octaves) are INDEPENDENT, so a weak GPU can keep
#   crisp cloud tops and drop the step count instead of the shape.
#
# [v1.2.0] PHYSICAL ATMOSPHERE - begin/begin1 still build the 64x32 / 32x16
#   transmittance and multi-scatter LUTs every frame, but the coefficients are
#   now derived from the measured Rayleigh/aerosol/ozone column depths instead
#   of hand-tuned values, and the twilight is produced by the optical path
#   rather than by a global on/off ramp. SKY_MODE=1 remains opt-in because it
#   costs a second per-pixel march in heavy weather; the default gradient sky
#   reads the same LUTs, so terrain fog, water reflection, clouds and godrays
#   are consistent in both modes.
#
# [v1.2.0] GODRAYS - the shafts sample a filtered (not binary) shadow term, use
#   a fixed number of steps so the integral cannot jump when the sun moves, and
#   are gated by ONE cloud-shadow column per frame, evaluated in composite.vsh
#   and handed over as a flat varying.
#
# [v1.2.0] COLOUR - the twelve continuous colour controls are real sliders
#   (Iris `sliders` list) instead of three-stop buttons, with a tone-map
#   selector and an optional luma-protected RGB balance.
#
# [v1.1.4] Distant Horizons: LOD passes exist so Iris does not hide DH chunks,
#   depth/lighting are reconciled in composite.fsh, and the seam is a hard
#   deterministic hand-off at `far` (the old screen-door dither punched holes).
#   Still an experimental, partial integration, not full DH support.
dhShadow.enabled=false

# [v1.1.4] Post-processing pass scheduling. Composite programs are fullscreen
# passes; disabling inactive chains avoids needless texture reads/writes on lower
# profiles. The directives are supported by the modern Iris/OptiFine shader
# properties pipeline; the shader code keeps safe fallback branches too.
program.composite1.enabled=TAA
program.composite2.enabled=TAA
program.composite3.enabled=BLOOM
program.composite4.enabled=BLOOM
program.composite5.enabled=BLOOM
program.composite6.enabled=BLOOM
program.composite7.enabled=BLOOM

# [v1.1.4] Bloom intermediates are post-process-only, so they can safely use a
# half-resolution viewport. No gbuffer program writes to colortex3/4. This cuts
# bloom bandwidth/VRAM substantially while final.fsh linearly upsamples the glow.
size.buffer.colortex3=0.5 0.5
size.buffer.colortex4=0.5 0.5

# [v1.1.4] Tiny physical-atmosphere LUTs regenerated by begin/begin1 before
# gbuffers. Unlike the old unused full-screen c5/c6 buffers, these cost almost
# no VRAM and provide stable shared transmittance / multi-scatter data to sky,
# terrain fog, water reflection and the SSR sky fallback.
size.buffer.colortex5=64 32
size.buffer.colortex6=32 16

# Main Screen Layout
screen = <profile> [TRANSLATION_NOTICE] [LIGHTING] [SUN_MOON] [FOLIAGE] [WATER] [CLOUDS_MENU] [COLOR] [POST_PROCESS] [EXPERIMENTAL]

# Sub-Screen Layouts
screen.TRANSLATION_NOTICE = <empty> <empty> <empty> <empty>
# [v1.1.1-ui-hotfix] Split oversized option screens into smaller submenus.
# Some Iris/OptiFine UI builds silently hide buttons when a screen contains too many entries.
screen.LIGHTING = [SHADOW_OPTIONS] [PBR_OPTIONS] [AO_REFLECTIONS] AMBIENT_BRIGHTNESS LIGHT_WRAP LIGHTMAP_WARMTH COZY_LIGHTS
screen.SHADOW_OPTIONS = SHADOWS shadowMapResolution SHADOW_SOFTNESS shadowDistance SHADOW_LOD DH_SHADOW_RANGE SHADOW_PCSS_BLUR SHADOW_TINT
screen.PBR_OPTIONS = PBR_LIGHTING PBR_POM POM_DEPTH POM_STEPS PBR_STRENGTH PBR_DISTANCE
screen.AO_REFLECTIONS = SSAO SSAO_STRENGTH SSR SSR_QUALITY SSR_STRENGTH WET_REFLECTIONS
screen.SUN_MOON = SUN_INTENSITY SUN_TEMPERATURE SUN_HALO SUNRISE_GLOW <empty> MOON_INTENSITY MOON_TEMPERATURE
screen.FOLIAGE = WAVING_LEAVES WAVING_GRASS WIND_SPEED FOLIAGE_SSS VEGETATION_CANOPY
screen.WATER = WATER_WAVES WATER_TRANSPARENCY WATER_RIFFLES WATER_SPECULAR_STRENGTH <empty> WATER_WAVE_SCALE WATER_WAVE_DETAIL UNDERWATER_WAVES UNDERWATER_NIGHT_DARKNESS
# [v1.2.0] Quality and detail are one click from the top-level Sky & Clouds menu,
# not three, because they are the two settings a player actually reaches for.
screen.CLOUDS_MENU = [CLOUD_SHAPE] [CLOUD_PERF] [LIGHT_SHAFTS] [NIGHT_SKY] RAINBOW_STRENGTH
# [v1.2.0] Volumetric cloud controls: CLOUD_MODE picks the engine, COVERAGE the
# cloud fraction, DENSITY the extinction of the medium.
#[v1.2.0] Clouds are laid out in five short rows, because the two settings that
# decide FPS-versus-detail now sit next to each other instead of being spread over a
# long list: row 1 what the cloud IS (engine, coverage, density), row 2 how it is
# shaped, row 3 where and how big, row 4 the two resolution controls, row 5 shadows.
#[v1.2.0] ONE SCREEN PER QUESTION, because a long one loses buttons. The cloud
# screen had 22 cells -- more than any other screen in the pack -- and the rows that did
# not fit were pushed out of the panel instead of scrolling. Three short screens now:
# 7 cells on the main one, 5 on the body screen, 4 on the performance screen. Nothing
# was removed, everything is two clicks away.
screen.CLOUD_SHAPE = PROCEDURAL_CLOUDS CLOUD_MODE CLOUD_COVERAGE CLOUD_DENSITY <empty> CLOUD_MICRO CLOUD_SCALE CLOUD_CIRRUS <empty> [CLOUD_BODY] [CLOUD_PERF]
# Height, thickness, distance and the two things that vary from cloud to cloud.
screen.CLOUD_BODY = CLOUD_MID_LAYER CLOUD_HEIGHT CLOUD_THICKNESS CLOUD_DISTANCE <empty> CLOUD_BASE_VARIATION CLOUD_UPDRAFT
# Everything that trades picture for frame time, together, so the two resolution
# controls can be compared side by side.
screen.CLOUD_PERF = CLOUD_QUALITY CLOUD_DETAIL <empty> CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH
screen.LIGHT_SHAFTS = GODRAYS GODRAYS_QUALITY GODRAYS_STRENGTH
screen.NIGHT_SKY = AURORA_MODE AURORA_SPEED AURORA_STRENGTH AURORA_QUALITY NEBULA_BRIGHTNESS STARS_BRIGHTNESS STARS_AMOUNT SHOOTING_STARS SHOOTING_STARS_FREQUENCY SHOOTING_STARS_BRIGHTNESS
# [v1.2.0] 15 cells was the second-longest screen in the pack; the fog and the
# image treatment move to their own screen, leaving 7 + 6.
screen.POST_PROCESS = SPATIAL_AA_MODE BLOOM HDR_BLOOM POST_SHARPEN <empty> TAA TAA_STRENGTH TAA_JITTER <empty> [POST_FOG]
screen.POST_FOG = HEAT_SHIMMER HEAT_SHIMMER_STRENGTH FOG_DENSITY_LEVEL GROUND_MIST GROUND_MIST_DENSITY DITHER_STRENGTH
screen.EXPERIMENTAL = SKY_MODE SKY_STYLE SKY_QUALITY [ATMOSPHERE_OPTIONS]
# [v1.2.0] COLOUR section — every control here is a float, so Iris draws it
# as a slider instead of a cycling button. Three sub-screens keep the panel short:
# tone (exposure/brightness/contrast), per-channel (RGB + white balance), look
# (vibrance, vignette, tone curve).
screen.COLOR = [COLOR_TONE] [COLOR_RGB] [COLOR_LOOK] <empty> <empty> <empty>
screen.COLOR_TONE = COLOR_EXPOSURE COLOR_BRIGHTNESS COLOR_CONTRAST <empty> COLOR_SATURATION COLOR_GAMMA COLOR_TONEMAP
screen.COLOR_RGB = COLOR_RED COLOR_GREEN COLOR_BLUE COLOR_LUMA_PROTECT <empty> COLOR_WARMTH COLOR_TINT
screen.COLOR_LOOK = COLOR_VIBRANCE COLOR_VIGNETTE VIGNETTE <empty> <empty> <empty>
screen.ATMOSPHERE_OPTIONS = ATMOSPHERE_TURBIDITY ATMOSPHERE_SCALE GROUND_BOUNCE_MODE SKY_TEMPORAL

# ==============================================================================
# PROFILES — v1.1.0 with Atmospheric Scattering
# [v1.1.4] Shadow distance now also gives Distant Horizons receiver shadows a
# useful map footprint: VERY_LOW/LOW 60m (no shadows), MED 192m, HIGH/ULTRA
# 512m, EXTREME 768m. SHADOW_LOD and DH_SHADOW_RANGE prevent far LOD receivers
# from using the near-camera PCF budget.
