# ==============================================================================
# AuraLite Shader Pack - Block Properties Mapping for Waving Foliage, Ice, Portals and Lava
# ==============================================================================
# [v1.1.0] Fixed lava block mapping to include minecraft:magma_block.
# [v1.0.6] Added lava blocks (10009) — glowing procedural magma with heat shimmer.
# [v1.0.4] Split ice: regular ice (10005) renders with texture + semi-transparency,
#          packed/blue ice (10007) renders opaque with texture.
# [v1.0.4] Added glass blocks (10008) — renders with texture + proper transparency.

# Waving Leaves (10001)
block.10001=minecraft:oak_leaves minecraft:spruce_leaves minecraft:birch_leaves minecraft:jungle_leaves minecraft:acacia_leaves minecraft:dark_oak_leaves minecraft:mangrove_leaves minecraft:cherry_leaves minecraft:azalea_leaves minecraft:flowering_azalea_leaves

# [v1.2.0] Foliage split into THREE classes. v1.1.4 put short grass, tall
# grass, ferns and every flower into one id (10002), so they all swayed
# identically and shared one material tag — there was no way to tell them apart.
#
# TALL plants (10002): double-height, long whippy stalks — they bend from the
# base, the top travels furthest, the motion is slow and heavy.
block.10002=minecraft:tall_grass minecraft:large_fern minecraft:sunflower minecraft:lilac minecraft:rose_bush minecraft:peony

# SHORT grass (10011): one block, stiff and dense — small high-frequency flutter.
# `minecraft:short_grass` is the 1.20.3+ name, `minecraft:grass` the legacy one.
block.10011=minecraft:short_grass minecraft:grass minecraft:fern

# FLOWERS (10012): stiff stem, the head bobs; tall flowers stay in 10002 above.
block.10012=minecraft:dandelion minecraft:poppy minecraft:blue_orchid minecraft:allium minecraft:azure_bluet minecraft:red_tulip minecraft:orange_tulip minecraft:white_tulip minecraft:pink_tulip minecraft:oxeye_daisy minecraft:cornflower minecraft:lily_of_the_valley minecraft:wither_rose

# Waving Crops (10003)
block.10003=minecraft:wheat minecraft:carrots minecraft:potatoes minecraft:beetroots minecraft:melon_stem minecraft:pumpkin_stem minecraft:sweet_berry_bush

# Waving Vines and Lilies (10004)
block.10004=minecraft:vine minecraft:glow_lichen minecraft:lily_pad minecraft:hanging_roots

# Regular Ice (10005) — Renders with actual ice texture, semi-transparent, NO water waves.
block.10005=minecraft:ice

# Nether Portal blocks (10006)
block.10006=minecraft:nether_portal

# Packed Ice & Blue Ice (10007) — Opaque/almost opaque with texture, NO waves.
block.10007=minecraft:packed_ice minecraft:blue_ice minecraft:frosted_ice

# Glass blocks (10008) — All glass types render with their actual texture + transparency.
block.10008=minecraft:glass minecraft:glass_pane minecraft:white_stained_glass minecraft:orange_stained_glass minecraft:magenta_stained_glass minecraft:light_blue_stained_glass minecraft:yellow_stained_glass minecraft:lime_stained_glass minecraft:pink_stained_glass minecraft:gray_stained_glass minecraft:light_gray_stained_glass minecraft:cyan_stained_glass minecraft:purple_stained_glass minecraft:blue_stained_glass minecraft:brown_stained_glass minecraft:green_stained_glass minecraft:red_stained_glass minecraft:black_stained_glass minecraft:white_stained_glass_pane minecraft:orange_stained_glass_pane minecraft:magenta_stained_glass_pane minecraft:light_blue_stained_glass_pane minecraft:yellow_stained_glass_pane minecraft:lime_stained_glass_pane minecraft:pink_stained_glass_pane minecraft:gray_stained_glass_pane minecraft:light_gray_stained_glass_pane minecraft:cyan_stained_glass_pane minecraft:purple_stained_glass_pane minecraft:blue_stained_glass_pane minecraft:brown_stained_glass_pane minecraft:green_stained_glass_pane minecraft:red_stained_glass_pane minecraft:black_stained_glass_pane minecraft:tinted_glass

# [v1.2.0] WATER (10020). Pak was NEVER assigned an ID for water -
# therefore, the mc_Entity of the water did not coincide with any material, it went into
# branch “unknown marked block”, and all identification of water rested on
# guesses on color and depth. Now she has her own ID, and no one
# heuristics are no longer needed.
block.10020=minecraft:water minecraft:flowing_water

# Lava (10009) — Glowing procedural magma, slow fluid waves, viscous PBR, heat shimmer.
block.10009=minecraft:lava minecraft:flowing_lava minecraft:magma_block

# [NEW v1.1.3] Waving Underwater Plants (10010) — seagrass/kelp sway in a
# current; displacement lives in gbuffers_terrain.vsh and is mirrored in
# shadow.vsh so the shadows follow the fronds.
block.10010=minecraft:seagrass minecraft:tall_seagrass minecraft:kelp minecraft:kelp_plant minecraft:sea_pickle

