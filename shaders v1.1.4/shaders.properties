# ==============================================================================
# AuraLite Shader Pack - Menu & Settings Configuration (v1.1.4)
# ==============================================================================
# [v1.1.0] TRUE VOLUMETRIC GODRAYS — full single-scattering raymarch with
#   per-step shadow-map occlusion (real crepuscular rays carved by geometry),
#   interleaved-gradient dithering (TAA-rotated), exact Beer–Lambert segment
#   integration and colored sun/moon radiance. Replaces the old forward-boost
#   screen-space approximation. Same GODRAYS / GODRAYS_QUALITY options.
# [v1.1.4] REALTIME PHYSICAL SKY (EXPERIMENTAL, OFF in all profiles) —
#   per-pixel Rayleigh/Mie/Ozone primary scattering plus tiny begin-pass HDR
#   LUTs for solar transmittance and bounded multi-scatter / biome ground bounce.
#   c5/c6 are 64x32 / 32x16, avoiding the old full-screen allocation. Terrain
#   fog, water reflection, clouds, godrays and SSR fallback share this data.
#   Enable manually via Experimental tab (SKY_MODE=1). SKY_MODE: 0=Gradient, 1=Physical.
# [v1.1.2] Extended shadow distance to render distance (256-384m) with adaptive
#   LOD system. Shadows no longer hard-cut at 60-160m. Quality degrades gracefully
#   via sample-count reduction (32->16->8->4) and filter-radius expansion at
#   distance. Added SHADOW_LOD option (Off/Balanced/Aggressive).
# [FIX v1.1.2] DISTANT HORIZONS SUPPORT — added dh_terrain.vsh/.fsh, dh_water.vsh/.fsh
#   and dh_shadow.vsh/.fsh. Without these, Iris marks the whole pack as
#   "incompatible" with Distant Horizons and simply does not draw DH's simplified
#   LOD chunks through it at all (shader still renders normally otherwise — this
#   was the "shader works but DH chunks are invisible" symptom). No properties key
#   is required to enable this: dhShadow.enabled defaults to true and DH detects
#   dh_terrain's presence automatically. See:
#   https://github.com/IrisShaders/ShaderDoc/blob/master/dh-support.md
# [v1.1.2-rebalance] Shadow distance now scales per-profile: 60m (VERY_LOW/LOW,
#   no shadows), 120m (MED, sweet spot), 256m (HIGH/ULTRA), 384m (EXTREME).
# [v1.1.1] Pipeline directives: keep HDR buffers and TAA history alive.
# [v1.0.7] Comprehensive Bug Fix & Stability Update across all shader passes.
# [v1.0.7] Comprehensive Bug Fix & Stability Update across all shader passes.
# [v1.0.4] Full profile rebalance: smoother progression, better feature distribution.
# [v1.0.4-fixed] Replaced fma() with direct multiply-add for GLSL compatibility.
# [v1.1.4] DISTANT HORIZONS — dh_terrain/dh_water receive TAA jitter,
# reproject through DH's own previous projection, use a hard deterministic seam
# (instead of hole-producing screen-door dither), and recognize DH tex0/tex1
# depth pairs for water/refraction fallback paths.
# DH_SHADOW_RANGE controls how far DH receivers keep sampling the shared dh_shadow map.
# [COMPAT v1.1.4] DH 3.2.0-b + Iris 1.7.6 can replace/cull the normal terrain
# shadow pass: symptom = mob shadows remain but terrain shadows disappear, even
# in vanilla chunks. Prefer stable vanilla terrain shadows by disabling ONLY the
# DH-specific shadow pass by default. Users with a verified working Iris/DH bridge
# can change this to true manually and then use DH_SHADOW_RANGE.
dhShadow.enabled=false

# [v1.1.4] Post-processing pass scheduling. Composite programs are fullscreen
# passes; disabling inactive chains avoids needless texture reads/writes on lower
# profiles. The directives are supported by the modern Iris/OptiFine shader
# properties pipeline; the shader code keeps safe fallback branches too.
program.composite1.enabled=TAA
program.composite2.enabled=TAA
program.composite3.enabled=BLOOM
program.composite4.enabled=BLOOM
program.composite5.enabled=BLOOM
program.composite6.enabled=BLOOM
program.composite7.enabled=BLOOM

# [v1.1.4] Bloom intermediates are post-process-only, so they can safely use a
# half-resolution viewport. No gbuffer program writes to colortex3/4. This cuts
# bloom bandwidth/VRAM substantially while final.fsh linearly upsamples the glow.
size.buffer.colortex3=0.5 0.5
size.buffer.colortex4=0.5 0.5

# [v1.1.4] Tiny physical-atmosphere LUTs regenerated by begin/begin1 before
# gbuffers. Unlike the old unused full-screen c5/c6 buffers, these cost almost
# no VRAM and provide stable shared transmittance / multi-scatter data to sky,
# terrain fog, water reflection and the SSR sky fallback.
size.buffer.colortex5=64 32
size.buffer.colortex6=32 16

# Main Screen Layout
screen = <profile> [TRANSLATION_NOTICE] [LIGHTING] [SUN_MOON] [FOLIAGE] [WATER] [CLOUDS_MENU] [POST_PROCESS] [EXPERIMENTAL]

